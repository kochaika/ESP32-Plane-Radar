; ESP32-C3 + 1.28" round GC9A01 (240×240)
;
;   supermini  MakerGO ESP32-C3 Super Mini  (Arduino IDE: "ESP32C3 Dev Module")
;   xiao_c3    Seeed Studio XIAO ESP32C3    (GPIO0/GPIO1 are not broken out —
;              display pins are remapped below via PR_PIN_DISPLAY_* flags)

[platformio]
default_envs = xiao_c3

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (native USB on both boards)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  ; >=1.2.26 declares its own global `namespace fonts`; older versions do not
  lovyan03/LovyanGFX@^1.2.26
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

[env:supermini]
board = esp32-c3-devkitm-1
; Display pins = config.h defaults (RST 0, CS 1, DC 10, MOSI 3, SCLK 4)

[env:xiao_c3]
board = seeed_xiao_esp32c3
; XIAO exposes GPIO 2..10,20,21 only; 2/8/9 are strapping pins and 20/21 are UART0,
; so the display lives on the six remaining pins. SCLK/MOSI use the SPI2 IOMUX pads.
build_flags =
  ${env.build_flags}
  -DPR_PIN_DISPLAY_RST=4    ; D2
  -DPR_PIN_DISPLAY_CS=10    ; D10
  -DPR_PIN_DISPLAY_DC=5     ; D3
  -DPR_PIN_DISPLAY_MOSI=7   ; D5 (FSPID)
  -DPR_PIN_DISPLAY_SCLK=6   ; D4 (FSPICLK)
